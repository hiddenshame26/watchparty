<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        input {
            padding: 12px;
            width: 250px;
            border-radius: 6px;
            border: none;
            margin: 5px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #5865f2;
            color: white;
            cursor: pointer;
            margin: 5px;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        #party {
            display: none;
            margin-top: 30px;
        }

        video {
            width: 100%;
            max-height: 500px;
            background: black;
            border-radius: 10px;
            margin-top: 20px;
        }

        #chat {
            margin-top: 20px;
            background: #1c1c1c;
            padding: 15px;
            border-radius: 10px;
        }

        #messages {
            height: 150px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 10px;
        }

        .message {
            padding: 5px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Watch Party</h1>

    <p>Create or join a party with your friends.</p>

    <div id="lobby">

        <input
            id="partyCode"
            placeholder="Enter party code"
        >

        <br>

        <button onclick="createParty()">
            Create Party
        </button>

        <button onclick="joinParty()">
            Join Party
        </button>

    </div>

    <div id="party">

        <h2>
            Party:
            <span id="currentCode"></span>
        </h2>

        <button onclick="startScreenShare()">
            🖥️ Share My Screen
        </button>

        <video
            id="screen"
            autoplay
            playsinline
            controls
        ></video>

        <div id="chat">

            <h3>Chat</h3>

            <div id="messages"></div>

            <input
                id="chatInput"
                placeholder="Type a message..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

<script>

let socket;
let currentParty;
let peerConnections = {};
let localStream = null;

const rtcConfig = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

function connectSocket() {

    const protocol =
        window.location.protocol === "https:"
            ? "wss://"
            : "ws://";

    socket = new WebSocket(
        protocol + window.location.host
    );

    socket.onopen = function() {

        socket.send(JSON.stringify({
            type: "join",
            code: currentParty
        }));

    };

    socket.onmessage = async function(event) {

        const data = JSON.parse(event.data);

        if (data.type === "chat") {
            addMessage(data.message);
        }

        if (data.type === "system") {
            addMessage("SYSTEM: " + data.message);
        }

        if (data.type === "signal") {
            await handleSignal(data.signal);
        }

    };

    socket.onerror = function(error) {
        console.error("WebSocket error:", error);
    };

}

function createParty() {

    const code = Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

    join(code);

}

function joinParty() {

    const code =
        document
            .getElementById("partyCode")
            .value
            .trim()
            .toUpperCase();

    if (!code) {

        alert("Enter a party code.");

        return;

    }

    join(code);

}

function join(code) {

    currentParty = code;

    document
        .getElementById("currentCode")
        .textContent = code;

    document
        .getElementById("lobby")
        .style.display = "none";

    document
        .getElementById("party")
        .style.display = "block";

    connectSocket();

}

async function startScreenShare() {

    try {

        localStream =
            await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: true
            });

        document
            .getElementById("screen")
            .srcObject = localStream;

        const peer =
            await createPeerConnection();

        const offer =
            await peer.createOffer();

        await peer.setLocalDescription(offer);

        socket.send(JSON.stringify({
            type: "signal",
            signal: {
                offer: offer
            }
        }));

    } catch (error) {

        console.error(error);

        alert("Screen sharing was cancelled.");

    }

}

async function createPeerConnection() {

    const peer =
        new RTCPeerConnection(rtcConfig);

    peerConnections.remote = peer;

    peer.pendingCandidates = [];

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                peer.addTrack(
                    track,
                    localStream
                );

            });

    }

    peer.ontrack = function(event) {

        document
            .getElementById("screen")
            .srcObject = event.streams[0];

    };

    peer.onicecandidate = function(event) {

        if (event.candidate) {

            socket.send(JSON.stringify({
                type: "signal",
                signal: {
                    candidate: event.candidate
                }
            }));

        }

    };

    return peer;

}

async function handleSignal(signal) {

    let peer = peerConnections.remote;

    if (!peer) {

        peer = await createPeerConnection();

    }

    if (!peer.pendingCandidates) {

        peer.pendingCandidates = [];

    }

    if (signal.offer) {

        await peer.setRemoteDescription(
            new RTCSessionDescription(signal.offer)
        );

        for (const candidate of peer.pendingCandidates) {

            try {

                await peer.addIceCandidate(candidate);

            } catch (error) {

                console.error(
                    "ICE candidate error:",
                    error
                );

            }

        }

        peer.pendingCandidates = [];

        const answer =
            await peer.createAnswer();

        await peer.setLocalDescription(answer);

        socket.send(JSON.stringify({
            type: "signal",
            signal: {
                answer: answer
            }
        }));

    }

    if (signal.answer) {

        await peer.setRemoteDescription(
            new RTCSessionDescription(signal.answer)
        );

        for (const candidate of peer.pendingCandidates) {

            try {

                await peer.addIceCandidate(candidate);

            } catch (error) {

                console.error(
                    "ICE candidate error:",
                    error
                );

            }

        }

        peer.pendingCandidates = [];

    }

    if (signal.candidate) {

        const candidate =
            new RTCIceCandidate(signal.candidate);

        if (peer.remoteDescription) {

            try {

                await peer.addIceCandidate(candidate);

            } catch (error) {

                console.error(
                    "ICE candidate error:",
                    error
                );

            }

        } else {

            peer.pendingCandidates.push(candidate);

        }

    }

}

function sendMessage() {

    const input =
        document.getElementById("chatInput");

    const message =
        input.value.trim();

    if (!message) return;

    socket.send(JSON.stringify({
        type: "chat",
        message: message
    }));

    addMessage("You: " + message);

    input.value = "";

}

function addMessage(message) {

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className = "message";

    div.textContent = message;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

}

</script>

</body>
</html>
